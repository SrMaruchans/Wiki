site_name: Wolfland Network
site_description: Wiki oficial de Wolfland Network, servidor de Minecraft Survival Custom

theme:
  name: material
  language: es
  palette:
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
  features:
    - navigation.tabs
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - Cómo unirse: unirse.md
  - Reglas: reglas.md
  - Comandos: comandos.md
  - Rangos: rangos.md
  - Comunidad:
      - Staff: staff.md
      - Eventos: eventos.md
  - Noticias: noticias.md
  - Discord: https://discord.com/invite/jCmngqZRFV
  - Tienda: https://wolfland.tebex.store/

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.com/invite/jCmngqZRFV
      name: Discord de Wolfland Network
    - icon: fontawesome/solid/store
      link: https://wolfland.tebex.store/
      name: Tienda de Wolfland Network
